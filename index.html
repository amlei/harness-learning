<!doctype html>
<html lang="zh-CN" data-theme="atelier">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Harness Learning — a source-code atelier</title>
<meta name="description" content="个人源码学习工坊：按开源仓库自身风格排印的源码实现剖析与文章整理。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f6f1e6'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='%238a2e2e'%3E%E2%9D%A6%3C/text%3E%3C/svg%3E" />

<!-- shared design system -->
<link rel="stylesheet" href="./reader/reader.css" />
<!-- directory data -->
<script src="./catalog.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Spectral:ital,wght@0,400;0,500;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
<div class="scrim" id="scrim"></div>

<aside class="spine" id="spine">
  <a class="brand" href="./">
    <span class="cad">❦</span>
    <span class="bt"><b>Harness Learning</b><span>source atelier</span></span>
  </a>
  <p class="tagline">A private atelier of source-code monographs — each volume set in the type &amp; colour of its subject.</p>

  <div class="div"></div>
  <p class="label"><span>Source</span><em id="srcCount"></em></p>
  <ul class="slist" id="srcList"></ul>

  <div class="div"></div>
  <p class="label"><span>Papers</span><em id="paperCount"></em></p>
  <ul class="slist" id="paperList"></ul>

  <div class="foot">
    maintained by <a href="https://github.com/amlei" target="_blank" rel="noopener">@amlei</a><br>
    <a href="https://github.com/amlei/harness-learning" target="_blank" rel="noopener">amlei / harness-learning</a><br>
    <span style="color:var(--mute-2)">crafted · 2026</span>
  </div>
</aside>

<div class="main">
  <div class="topbar show" id="topbar">
    <button class="menu-btn" id="menuBtn">☰ index</button>
    <a href="./"><span>❦</span> atelier</a>
    <span class="sep">/</span>
    <span>directory</span>
  </div>
  <div id="view"></div>
</div>

<script>
const T = CATALOG.THEMES;
const srcList = document.getElementById('srcList');
const paperList = document.getElementById('paperList');

function buildSpine(){
  srcList.innerHTML = CATALOG.source.length
    ? CATALOG.source.map(p=>{const th=T[p.theme]||T.atelier;return `<li><a href="./source/${p.id}/"><span class="m" style="color:${th.accent}">${th.mark}</span>${p.title}<span class="dot"></span></a></li>`}).join('')
    : '<li class="empty">尚无 — 见 catalog.js</li>';
  document.getElementById('srcCount').textContent = CATALOG.source.length? CATALOG.source.length+' 卷':'';
  paperList.innerHTML = CATALOG.paper.length
    ? CATALOG.paper.map(p=>{const th=T[p.theme]||T.periodical;return `<li><a href="./paper/${p.id}/"><span class="m" style="color:${th.accent}">${th.mark}</span>${p.title}<span class="dot"></span></a></li>`}).join('')
    : '<li class="empty">即将新增</li>';
  document.getElementById('paperCount').textContent = CATALOG.paper.length? CATALOG.paper.length+' 篇':'';
}

function render(){
  const totalParts = 14 * CATALOG.source.length; // each source is its own reader; count is illustrative
  const pcards = CATALOG.source.length ? CATALOG.source.map((p,i)=>{
    const th=T[p.theme]||T.atelier;
    return `<a class="pcard stagger" style="animation-delay:${.1+i*.06}s;--pc-accent:${th.accent};--pc-display:'${th.display}'" href="./source/${p.id}/">
      <div class="m">${th.mark}</div>
      <div class="t">${p.title}</div>
      <p class="tag">${p.tagline}</p>
      <div class="charsw">${(p.statsLabel||'').split(' · ').map(k=>`<span>${k}</span>`).join('')}</div>
      <div class="char">${th.character}</div>
      <div class="footr"><span>作者 <b>${p.author}</b></span><span>${p.updated}</span><span class="go">open →</span></div>
    </a>`;
  }).join('') : '<p class="empty-note">尚无源码卷。在 <code>catalog.js</code> 添加项目，并建 <code>source/&lt;id&gt;/index.html</code>。</p>';

  const plist = CATALOG.paper.length ? CATALOG.paper.map((p,i)=>{
    const th=T[p.theme]||T.periodical;
    return `<a class="pitem stagger" style="animation-delay:${.1+i*.05}s" href="./paper/${p.id}/">
      <div class="pn">${th.mark}</div>
      <div><h4>${p.title}</h4><p>${p.blurb||''}</p></div>
      <div class="pm"><b>${p.updated}</b>${p.author||''}</div>
    </a>`;
  }).join('') : '<p class="empty-note">Papers 即将新增 —— 博客文章、论文与技术资料整理会落在 <code>paper/&lt;id&gt;/</code> 并登记到 <code>catalog.js</code>。</p>';

  document.getElementById('view').innerHTML = `
  <section class="wrap">
    <div class="hero">
      <div class="eyebrow">a source-code atelier <em>· multi-repo</em></div>
      <h1><i>Harness</i><b>Learning.</b></h1>
      <p class="lede">每个开源仓库都有自己的脾气。这里不是把它们拍扁成同一种文档皮肤——
      而是<strong>按每个仓库自身的风格</strong>排印它的源码剖析。一座私人源码工坊，读的是"它是怎么被造出来的"。</p>
      <div class="meta">
        <span class="pip"><b>${CATALOG.source.length}</b> 个源码卷</span>
        <span class="pip"><b>${CATALOG.paper.length}</b> 篇 paper</span>
        <span class="pip">作者 <b>Amlei</b></span>
      </div>
    </div>

    <div class="principle">
      <p class="pl">house rule · 排印随对象而变</p>
      <h3>每个仓库，一种排印；每卷一个独立页面。</h3>
      <p>本工坊的规则：源码卷的视觉主题（字体、配色、印记）需<strong>呼应其上游仓库本身的气质</strong>，而非套用统一文档皮肤。
      Hermes 是金色编辑体（它的 CLI 本就是金／卡哇伊）；未来的系统类项目会是石墨色实用体，框架类会是冷峻无衬线。</p>
      <p>每卷源码都有自己独立的 <code>source/&lt;project&gt;/index.html</code>——互不影响，主仓库的首页只作目录。</p>
    </div>

    <div class="section">
      <div class="shead"><span class="n">§ 01</span><h2>Source · 源码剖析</h2><span class="rule"></span><span class="count">${CATALOG.source.length} 卷</span></div>
      <div class="pcgrid">${pcards}</div>
    </div>

    <div class="section">
      <div class="shead"><span class="n">§ 02</span><h2>Papers · 文章整理</h2><span class="rule"></span><span class="count">${CATALOG.paper.length} 篇</span></div>
      <div class="plist">${plist}</div>
    </div>
  </section>`;
}

/* mobile spine */
const spine=document.getElementById('spine'),scrim=document.getElementById('scrim');
document.getElementById('menuBtn').addEventListener('click',()=>spine.classList.add('open'));
scrim.addEventListener('click',()=>{spine.classList.remove('open');scrim.classList.remove('show');});
new MutationObserver(()=>scrim.classList.toggle('show',spine.classList.contains('open'))).observe(spine,{attributes:true,attributeFilter:['class']});

buildSpine();
render();
</script>
</body>
</html>
